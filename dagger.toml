# Dagger workspace configuration
# Install modules with: dagger module install <module>
# Example:
#   dagger module install github.com/dagger/dagger/modules/wolfi

# Marker filename that skips generate when found at or above a TypeScript SDK module root.
# settings.skipGenerateFilename = ""

[modules.e2e]
source = ".dagger/modules/e2e"

[modules.engine-e2e]
source = ".dagger/modules/engine-e2e"

[modules.packager]
source = ".dagger/modules/packager"

[modules.runtimes]
source = ".dagger/modules/runtimes"

[modules.typescript-sdk]
source = "."
check.skip = ["*"]

[sdks.typescript]
module = "typescript-sdk"

[sdks.typescript.scopes.".dagger/modules/e2e/fixtures/generate/app"]
is-module = true
name = "generate-app"

[sdks.typescript.scopes.".dagger/modules/e2e/fixtures/lookup/app"]
is-module = true
name = "lookup-app"

[sdks.typescript.scopes.".dagger/modules/e2e/fixtures/skip/app"]
is-module = true
name = "skip-app"

[sdks.typescript.scopes.".dagger/modules/e2e/fixtures/managed-toml/app"]
is-module = true
name = "managed-toml-app"

# A Deno module: same bindings and entrypoint as node/bun, but its config lives
# in deno.json, the only part of generation that branches on runtime.
[sdks.typescript.scopes.".dagger/modules/e2e/fixtures/generate-deno/app"]
is-module = true
name = "generate-deno-app"

# A module and the local module it depends on. The dependency is recorded as the
# dependent's client, which is what orders its scope first when the engine
# drives generation.
[sdks.typescript.scopes.".dagger/modules/e2e/fixtures/generate-deps/app"]
is-module = true
name = "generate-deps-app"
clients = ["./.dagger/modules/e2e/fixtures/generate-deps/dep"]

[sdks.typescript.scopes.".dagger/modules/e2e/fixtures/generate-deps/dep"]
is-module = true
name = "gendep"

# The legacy-format counterpart of generate-deps: a dagger.json module with a
# local dagger.json dependency. Generation routes to the engine for these, the
# one path where the SDK hands back a workspace it did not assemble itself.
#
# The dependency is not recorded as a client. A legacy module is regenerated by
# the engine's own runtime at load time, so its dependency's schema loads
# without the dependency having been generated first, and recording the edge
# would only make generate reserialize a hand-written dagger.json.
[sdks.typescript.scopes.".dagger/modules/e2e/fixtures/generate-legacy-deps/app"]
is-module = true
name = "legacy-deps-app"

[sdks.typescript.scopes.".dagger/modules/e2e/fixtures/generate-legacy-deps/dep"]
is-module = true
name = "legacydep"

[sdks.typescript.scopes.".dagger/modules/e2e/fixtures/parent-source/.dagger/modules/app"]
is-module = true
name = "parent-source-app"

[sdks.typescript.scopes.".dagger/modules/runtimes/fixtures/bun"]
is-module = true
name = "runtime-bun"

[sdks.typescript.scopes.".dagger/modules/runtimes/fixtures/deno"]
is-module = true
name = "runtime-deno"

[sdks.typescript.scopes.".dagger/modules/runtimes/fixtures/node"]
is-module = true
name = "runtime-node"

[sdks.typescript.scopes.".dagger/modules/e2e/fixtures/client/out"]
clients = ["./.dagger/modules/e2e/fixtures/client/app"]
