# Dagger workspace configuration
# Install modules with: dagger module install <module>
# Example:
#   dagger module install github.com/dagger/dagger/modules/wolfi
#
# The [sdks.*] sections below are CLI-managed: the engine rewrites the whole
# block on any `dagger module` command and drops comments inside it, so notes
# about individual scopes live here instead.
#
# Every scope is a fixture this SDK generates into, so `dagger generate`
# exercises the real path and `dagger check` fails when one goes stale. Only
# dagger-module.toml modules are listed: a legacy dagger.json module is
# regenerated by the engine's runtime at call time, not by an SDK scope.
#
# The managed-toml and parent-source fixtures are deliberately absent. They
# exist for `mod` resolution and for reading a module's config, not for
# generation, and the scope list is what decides what `dagger generate` writes.
#
# generate-deps/app records a client for gendep it does not otherwise need. It
# depends on gendep through its manifest's [[dependencies]], and the engine's
# scope graph draws edges only from client targets — so without that entry the
# pair generates in path order and app's schema load fails on gendep's missing
# committed files.

[modules.e2e]
source = ".dagger/modules/e2e"

[modules.engine-e2e]
source = ".dagger/modules/engine-e2e"

[modules.packager]
source = ".dagger/modules/packager"

[modules.runtimes]
source = ".dagger/modules/runtimes"

[modules.typescript-sdk]
source = "."
check.skip = ["*"]

[sdks.typescript]
module = "typescript-sdk"

[sdks.typescript.scopes.".dagger/modules/e2e/fixtures/client/out"]
clients = [
  ".dagger/modules/e2e/fixtures/client/app",
]

[sdks.typescript.scopes.".dagger/modules/e2e/fixtures/generate-deno/app"]
is-module = true
name = "generate-deno-app"

[sdks.typescript.scopes.".dagger/modules/e2e/fixtures/generate-deps/app"]
is-module = true
name = "generate-deps-app"
clients = [
  ".dagger/modules/e2e/fixtures/generate-deps/dep",
]

[sdks.typescript.scopes.".dagger/modules/e2e/fixtures/generate-deps/dep"]
is-module = true
name = "gendep"

[sdks.typescript.scopes.".dagger/modules/runtimes/fixtures/bun"]
is-module = true
name = "runtime-bun"

[sdks.typescript.scopes.".dagger/modules/runtimes/fixtures/deno"]
is-module = true
name = "runtime-deno"

[sdks.typescript.scopes.".dagger/modules/runtimes/fixtures/node"]
is-module = true
name = "runtime-node"

