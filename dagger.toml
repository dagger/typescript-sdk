# Dagger workspace configuration
# Install modules with: dagger install <module>
# Example:
#   dagger install github.com/dagger/dagger/modules/wolfi

# Marker filename that skips generate when found at or above a TypeScript SDK module root.
# settings.skipGenerateFilename = ""

[modules.e2e]
source = ".dagger/modules/e2e"

[modules.packager]
source = ".dagger/modules/packager"

[modules.typescript-sdk]
source = "."
check.skip = ["*"]

[modules.sdk-sdk]
source = "github.com/dagger/sdk-sdk"

[modules.typescript-sdk.as-sdk]
name = "typescript"

[[modules.typescript-sdk.as-sdk.modules]]
path = ".dagger/modules/e2e/fixtures/generate/app"

[[modules.typescript-sdk.as-sdk.modules]]
path = ".dagger/modules/e2e/fixtures/lookup/app"

[[modules.typescript-sdk.as-sdk.modules]]
path = ".dagger/modules/e2e/fixtures/deps/app"

[[modules.typescript-sdk.as-sdk.modules]]
path = ".dagger/modules/e2e/fixtures/skip/app"

[[modules.typescript-sdk.as-sdk.modules]]
path = ".dagger/modules/e2e/fixtures/managed-toml/app"

[[modules.typescript-sdk.as-sdk.modules]]
path = ".dagger/modules/e2e/fixtures/generate-deps/app"

[[modules.typescript-sdk.as-sdk.modules]]
path = ".dagger/modules/e2e/fixtures/generate-deps/dep"

[[modules.typescript-sdk.as-sdk.modules]]
path = ".dagger/modules/e2e/fixtures/parent-source/.dagger/modules/app"

[[modules.typescript-sdk.as-sdk.clients]]
path = ".dagger/modules/e2e/fixtures/client/out"
module = ".dagger/modules/e2e/fixtures/client/app"
